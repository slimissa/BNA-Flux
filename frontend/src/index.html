<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>BNA-FLUX — Surveillance des Transactions Bancaires</title>
  <meta name="description" content="BNA-FLUX — Système de surveillance des transactions bancaires en temps réel. Pipeline de validation, enrichissement, évaluation de règles, notation du risque et piste d'audit hash-chaînée.">
  <meta name="author" content="Slim Issa — Stage BNA 2026">
  <meta name="theme-color" content="#1a3a5c">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/icons/bna-flux-logo.svg">
  <link rel="apple-touch-icon" href="assets/icons/bna-flux-logo-192.png">

  <!-- Polices Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <base href="/">

  <style>
       Écran de chargement — Affiché avant le bootstrap Angular
    .app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(180deg, #ffffff 0%, #f0f5f0 100%);
      color: #1a3c2a; font-weight: 600;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      position: relative;
    }

    .app-loading-logo {
      position: absolute;
      top: 24px;
      left: 32px;
      animation: none;
    }

    .app-loading-logo img {
      width: 100px;
      height: auto;
    }

    .app-loading-center {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-loading-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
      color: #1a3c2a; font-weight: 600;
    }

    .app-loading-subtitle {
      font-size: 14px;
      font-weight: 400;
      color: #6b9e74;
      margin-bottom: 32px;
      letter-spacing: 1px;
    }

    .app-loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e8f5e9;
      border-top-color: #1a8c4e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .app-loading-footer {
      position: absolute;
      bottom: 24px;
      font-size: 12px;
      color: #8db894;
      letter-spacing: 0.5px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.95); }
    }

    @keyframes shimmer {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
  </style>
</head>
<body>
  <!-- Écran de chargement -->
  <div class="app-loading" id="app-loading">
    <div class="app-loading-logo">
      <img src="assets/top-logo.png" alt="BNA" />
    </div>
    <div class="app-loading-center">
      <div class="app-loading-title">BNA-FLUX</div>
      <div class="app-loading-subtitle">Surveillance des Transactions Bancaires</div>
      <div class="app-loading-spinner"></div>
    </div>
    <div class="app-loading-footer">Banque Nationale Agricole © 2026</div>
  </div>

  <!-- Racine Angular -->
  <bna-root></bna-root>

    
</body>
</html>

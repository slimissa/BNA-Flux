spring:
  datasource:
    url: jdbc:h2:mem:bnaflux_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  cors:
    allowed-origins: http://localhost:4200
  jwt:
    secret: test-secret-key-for-jwt-signing-minimum-256-bits-long
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000

logging:
  level:
    com.bna.flux: WARN
